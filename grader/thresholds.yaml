# Hidden-grader thresholds (design D.3). Frozen together with the benchmark;
# changing a value after the freeze requires re-running every system.
version: 1
notes: Experiment-side thresholds (design D.3). min_validation_accuracy is set below
  the accuracy a correct repair reaches on the frozen validation split; the validation
  split is the SST-2 validation partition held out from agent-visible training data.
scenarios:
  clean-canonical:
    split: dev
    fault_family: none_clean
    min_validation_accuracy: 0.8
    max_memory: 3Gi
    expected_workers: 2
    cpu_only: true
    expected_model: distilbert-base-uncased
    expected_dataset: sst2
    fault_knob: none
    notes: 'Ground truth root cause NONE; acceptable fixes: NO_FIX_NEEDED.'
  gpu-nccl-backend:
    split: dev
    fault_family: gpu_only_code
    min_validation_accuracy: 0.8
    max_memory: 3Gi
    expected_workers: 2
    cpu_only: true
    expected_model: distilbert-base-uncased
    expected_dataset: sst2
    fault_knob: nccl_on_cpu
    notes: 'Ground truth root cause GPU_BACKEND_NCCL_ON_CPU; acceptable fixes: SET_BACKEND_GLOO.'
  mem-batch32-oom:
    split: dev
    fault_family: memory_limits
    min_validation_accuracy: 0.78
    max_memory: 3Gi
    expected_workers: 2
    cpu_only: true
    expected_model: distilbert-base-uncased
    expected_dataset: sst2
    fault_knob: oom
    notes: 'Ground truth root cause MEM_LIMIT_TOO_LOW_FOR_BATCH; acceptable fixes:
      REDUCE_BATCH_AND_ACCUMULATE, RAISE_MEMORY_WITHIN_LIMIT.'
  dep-torch-transformers:
    split: dev
    fault_family: dependency_conflict
    min_validation_accuracy: 0.78
    max_memory: 3Gi
    expected_workers: 2
    cpu_only: true
    expected_model: distilbert-base-uncased
    expected_dataset: sst2
    fault_knob: dep_mismatch
    notes: 'Ground truth root cause DEP_TORCH_TRANSFORMERS_MISMATCH; acceptable fixes:
      REBUILD_IMAGE_WITH_LOCKFILE, PIN_COMPATIBLE_VERSIONS.'
  data-label-invalid:
    split: dev
    fault_family: data_or_training_error
    min_validation_accuracy: 0.78
    max_memory: 3Gi
    expected_workers: 2
    cpu_only: true
    expected_model: distilbert-base-uncased
    expected_dataset: sst2
    fault_knob: label_invalid
    notes: 'Ground truth root cause DATA_LABEL_INVALID; acceptable fixes: SANITIZE_LABELS.'
  clean-alt-config:
    split: heldout
    fault_family: none_clean
    min_validation_accuracy: 0.8
    max_memory: 3Gi
    expected_workers: 2
