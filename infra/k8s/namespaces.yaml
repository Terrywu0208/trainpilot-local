# Namespaces for TrainPilot-Local (design B-1.3).
# The `default` namespace is never used. All agent workloads live in
# trainpilot-jobs, which enforces Pod Security Standards "restricted" -
# the Kubernetes-native second line of defense behind the tool-layer
# validators (design B-5.3).
apiVersion: v1
kind: Namespace
metadata:
  name: kuberay-system
  labels:
    app.kubernetes.io/part-of: trainpilot
    # The operator is installed by a human via Helm; no agent has any
    # permission in this namespace.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: trainpilot-jobs
  labels:
    app.kubernetes.io/part-of: trainpilot
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: trainpilot-system
  labels:
    app.kubernetes.io/part-of: trainpilot
    # Holds human-managed ConfigMaps (approved images, limits) that the
    # agent may read but never write.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
