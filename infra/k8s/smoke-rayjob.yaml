# Smoke RayJob: proves the KubeRay path end-to-end on a fresh cluster.
# Submitted by scripts/deploy_vm.sh after the operator is Ready.
#
# The manifest is Pod Security Standards "restricted"-compliant,
# because trainpilot-jobs enforces that profile: no hostPath (the
# workspace is the trainpilot-workspaces PVC, mounted on the head
# only), runAsNonRoot with the
# Ray image's uid 1000, RuntimeDefault seccomp, drop ALL capabilities,
# allowPrivilegeEscalation off. The submitter pod template carries
# the same context — the operator-generated default would be
# rejected by the namespace policy.
#
# shutdownAfterJobFinishes is false so the finished cluster stays up
# for inspection (logs, kubectl cp of the checkpoint); the deploy
# script's --teardown, or deleting this RayJob, removes it.
apiVersion: ray.io/v1
kind: RayJob
metadata:
  name: trainpilot-smoke
  namespace: trainpilot-jobs
  labels:
    app: trainpilot-local
    trainpilot/spec-hash: "smoke-001"
spec:
  entrypoint: >-
    mkdir -p /trainpilot/workspaces/smoke-001 &&
    python /app/training/train.py
    --config /app/training/smoke_config.yaml --backend smoke
  shutdownAfterJobFinishes: false
  ttlSecondsAfterFinished: 86400
  submitterPodTemplate:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ray-job-submitter
          image: trainpilot/training:2.41.0-cpu
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
  rayClusterSpec:
    rayVersion: "2.41.0"
    headGroupSpec:
      rayStartParams:
        dashboard-host: "0.0.0.0"
      template:
        spec:
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: ray-head
              image: trainpilot/training:2.41.0-cpu
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: "500m"
                  memory: "1Gi"
                limits:
                  cpu: "1"
                  memory: "1536Mi"
              volumeMounts:
                - name: workspaces
                  mountPath: /trainpilot/workspaces
          volumes:
            - name: workspaces
              persistentVolumeClaim:
                claimName: trainpilot-workspaces
    workerGroupSpecs:
      - groupName: train-workers
        replicas: 2
        minReplicas: 2
        maxReplicas: 2
        rayStartParams:
          num-cpus: "1"
        template:
          spec:
            securityContext:
              runAsNonRoot: true
              runAsUser: 1000
              runAsGroup: 1000
              fsGroup: 1000
              seccompProfile:
                type: RuntimeDefault
            containers:
              - name: ray-worker
                image: trainpilot/training:2.41.0-cpu
                imagePullPolicy: IfNotPresent
                securityContext:
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop:
                      - ALL
                resources:
                  requests:
                    cpu: "500m"
                    memory: "1Gi"
                  limits:
                    cpu: "1"
                    memory: "1536Mi"
                # No workspace mount on workers: the driver on the
                # head writes the checkpoint, and a ReadWriteOnce
                # volume cannot be mounted by pods on other nodes.
