# Kind cluster for TrainPilot-Local (design B-1).
# 1 control-plane + 2 workers. Only the workspaces/ directory is mounted
# into the worker nodes - never the whole repo, $HOME, or the Docker
# socket - so pods can write checkpoints/logs back to the host without
# being able to read anything else (for example .env files).
#
# The node image is digest-pinned for reproducibility. The digest below
# is the real published kindest/node v1.31.2 manifest digest (Docker
# Hub, verified 2026-11-17).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: trainpilot
nodes:
  - role: control-plane
    image: kindest/node:v1.31.2@sha256:18fbefc20a7113353c7b75b5c869d7145a6abd6269154825872dc59c1329912e
    labels:
      trainpilot.io/role: control-plane
  - role: worker
    image: kindest/node:v1.31.2@sha256:18fbefc20a7113353c7b75b5c869d7145a6abd6269154825872dc59c1329912e
    labels:
      trainpilot.io/role: worker
      trainpilot.io/compute: "true"
    extraMounts:
      - hostPath: ./workspaces
        containerPath: /trainpilot/workspaces
        readOnly: false
  - role: worker
    image: kindest/node:v1.31.2@sha256:18fbefc20a7113353c7b75b5c869d7145a6abd6269154825872dc59c1329912e
    labels:
      trainpilot.io/role: worker
      trainpilot.io/compute: "true"
    extraMounts:
      - hostPath: ./workspaces
        containerPath: /trainpilot/workspaces
        readOnly: false
containerdConfigPatches:
  - |-
    [plugins."io.containerd.grpc.v1.cri".registry]
      config_path = "/etc/containerd/certs.d"
networking:
  disableDefaultCNI: false
  podSubnet: "10.244.0.0/16"
  serviceSubnet: "10.96.0.0/12"
