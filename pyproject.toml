[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trainpilot-local"
version = "1.0.0"
description = "TrainPilot-Local: a LangGraph agent that repairs KubeRay training runs, with a professor-standard evaluation harness (EE P 500 D final project)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "langgraph>=0.2",
]

[project.optional-dependencies]
webapp = ["fastapi>=0.110", "uvicorn>=0.29"]
eval = ["httpx>=0.27"]
train = ["torch", "transformers", "datasets", "ray[train]"]
dev = ["pytest>=8.0", "httpx>=0.27", "fastapi>=0.110", "uvicorn>=0.29"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"
