id: clean-small-lr
family: clean
user_request: Please fine-tune DistilBERT on SST-2 with Ray Train on my Kind cluster,
  2 CPU workers, and give me the checkpoint and validation accuracy.
injection: No fault injected; canonical configuration with a smaller learning rate
  (1e-5).
log_signature: none
expected_log_signatures: []
ground_truth:
  fault_family: none_clean
  root_cause_code: NONE
expected_keywords:
- succeeded
resource_limits:
  num_workers: 2
  cpu_per_worker: 2
