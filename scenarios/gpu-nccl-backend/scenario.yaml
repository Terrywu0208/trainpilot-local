id: gpu-nccl-backend
family: gpu_only
user_request: Please fine-tune DistilBERT on SST-2 with Ray Train on my Kind cluster,
  2 CPU workers, and give me the checkpoint and validation accuracy.
injection: 'configs/train_config: backend set to nccl on a CPU-only cluster.'
log_signature: NCCL_ON_CPU
expected_log_signatures:
- NCCL is not available
- not supported on CPU-only machines
ground_truth:
  fault_family: gpu_only_code
  root_cause_code: NCCL_ON_CPU
expected_keywords:
- NCCL
- CPU
- gloo
resource_limits:
  num_workers: 2
  cpu_per_worker: 2
  memory_per_worker: 2Gi
  max_memory_per_worker: 3Gi
  timeout_minutes: 25
config_overrides:
  backend: nccl
  per_worker_batch_size: 8
  gradient_accumulation_steps: 2
  num_workers: 2
  resources_per_worker_memory: 2Gi
  epochs: 1
  max_steps: 40
  learning_rate: 2.0e-05
  train_subsample: 1024
  val_subsample: 256
  max_length: 64
  seed: 42
  fault: nccl_on_cpu
correct_repair:
  backend: gloo
wrong_repair:
  knob: num_workers
  change: drop to 1 to bypass distributed init
  why_wrong: Violates the 2-worker request; also requesting a GPU leaves the pod Pending
    forever on Kind.
accuracy_threshold: 0.7
max_attempts: 3
clean_expected: false
